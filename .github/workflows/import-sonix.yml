name: Import Sonix Player base

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out InkOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream Sonix Player source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Tartarus6/sonix-player.git /tmp/sonix-player
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/import-sonix.yml' \
            /tmp/sonix-player/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Sonix Player base for InkOS"
          git push origin HEAD:main
